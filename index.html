<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">
  <!-- スマートフォンなどの画面幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>き - ポートフォリオ</title>
  <style>
    /* ========================================
       全体・基本スタイル（和風で落ち着いた雰囲気）
       ======================================== */
    :root {
      /* 好きな色（黒・青・ピンク・オレンジ・赤）を和風の落ち着いた色調に調整 */
      --bg-base: #f7f4ef;        /* 和紙のような生成り色の背景 */
      --bg-card: #ffffff;        /* カード部分の白背景 */
      --color-sumi: #1e1e24;     /* 墨色（黒）：メインの文字色や引き締め色 */
      --color-ai: #1f3a52;       /* 藍色（青）：見出しやアクセント */
      --color-momo: #d97a8c;     /* 桃色（ピンク）：優しい和のアクセント */
      --color-daidai: #d46a38;   /* 橙色（オレンジ）：温かみのあるアクセント */
      --color-aka: #a62c2b;      /* 茜色（赤）：ポイントカラー */
      --border-line: #dcd6cc;    /* 障子や枠線をイメージした薄い線 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      background-color: var(--bg-base);
      /* CSSのみで和紙の繊維や格子を思わせる繊細な背景模様を表現 */
      background-image: 
        radial-gradient(var(--border-line) 1px, transparent 1px),
        radial-gradient(var(--border-line) 1px, var(--bg-base) 1px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      color: var(--color-sumi);
      line-height: 1.8;
      letter-spacing: 0.05em;
    }

    /* ========================================
       ヘッダー（上部のタイトル・キャッチコピー）
       ======================================== */
    header {
      background-color: var(--color-sumi);
      color: #f7f4ef;
      text-align: center;
      padding: 3.5rem 1.5rem 3rem;
      border-bottom: 5px solid var(--color-ai);
      position: relative;
    }

    /* ヘッダー下部の和風な飾り線（好きな色を組み込んだグラデーション） */
    header::after {
      content: "";
      display: block;
      width: 100%;
      height: 4px;
      background: linear-gradient(
        to right,
        var(--color-ai),
        var(--color-momo),
        var(--color-daidai),
        var(--color-aka)
      );
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .site-subtitle {
      font-size: 0.9rem;
      color: var(--color-momo);
      letter-spacing: 0.2em;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: normal;
      letter-spacing: 0.3em;
      margin-bottom: 1.2rem;
      /* 家紋や落款印を思わせる枠飾り */
      display: inline-block;
      padding: 0.2em 0.8em;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .catchphrase {
      font-size: 1.1rem;
      color: #e6e0d6;
      margin-top: 0.5rem;
    }

    /* ========================================
       メインコンテンツ領域のレイアウト
       ======================================== */
    main {
      max-width: 820px;
      margin: 2.5rem auto;
      padding: 0 1.2rem;
    }

    /* 各セクションのカードデザイン */
    section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-line);
      border-left: 6px solid var(--color-ai);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 12px rgba(30, 30, 36, 0.05);
    }

    /* セクションごとに左側のアクセントカラーを好きな色で変化させる */
    section.sec-basic { border-left-color: var(--color-ai); }
    section.sec-hobby { border-left-color: var(--color-daidai); }
    section.sec-skill { border-left-color: var(--color-sumi); }
    section.sec-goal  { border-left-color: var(--color-aka); }
    section.sec-word  { border-left-color: var(--color-momo); }

    /* セクション見出しのデザイン */
    h2 {
      font-size: 1.35rem;
      color: var(--color-ai);
      border-bottom: 1px solid var(--border-line);
      padding-bottom: 0.6rem;
      margin-bottom: 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    /* 見出し前の和風なひし形装飾 */
    h2::before {
      content: "◆";
      font-size: 0.9rem;
      color: var(--color-aka);
    }

    /* ========================================
       基本情報リストのスタイル
       ======================================== */
    .basic-info-list {
      display: grid;
      grid-template-columns: 120px 1fr;
      row-gap: 0.8rem;
      align-items: baseline;
    }

    .basic-info-list dt {
      font-weight: bold;
      color: var(--color-ai);
      position: relative;
    }

    .basic-info-list dt::after {
      content: "：";
      position: absolute;
      right: 0.5rem;
    }

    .basic-info-list dd {
      padding-left: 0.5rem;
    }

    /* ========================================
       趣味・好きなことのタグ風リスト
       ======================================== */
    .hobby-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .hobby-list li {
      background-color: var(--bg-base);
      border: 1px solid var(--color-daidai);
      color: var(--color-sumi);
      padding: 0.45rem 1.1rem;
      font-size: 0.95rem;
      position: relative;
    }

    /* タグの左端に小さな色アクセント */
    .hobby-list li::before {
      content: "・";
      color: var(--color-daidai);
      font-weight: bold;
    }

    /* ========================================
       プログラミング経験のスタイル
       ======================================== */
    .skill-tags {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .skill-tags li {
      background-color: var(--color-sumi);
      color: #ffffff;
      padding: 0.3rem 0.9rem;
      font-size: 0.9rem;
      font-family: sans-serif; /* 言語名は読みやすいゴシック体に */
      letter-spacing: 0.03em;
    }

    .skill-note {
      font-size: 0.95rem;
      color: #4a4a52;
    }

    /* ========================================
       この授業で学びたいこと
       ======================================== */
    .goal-text {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--color-aka);
    }

    /* ========================================
       ひとこと（桃の花言葉）の特別装飾
       ======================================== */
    .sec-word {
      background-color: #fdf9fa;
      text-align: center;
      border-top: 1px solid var(--color-momo);
      border-right: 1px solid var(--color-momo);
      border-bottom: 1px solid var(--color-momo);
    }

    .sec-word h2 {
      justify-content: center;
      color: var(--color-aka);
    }

    .sec-word h2::before {
      color: var(--color-momo);
    }

    .word-quote {
      font-size: 1.2rem;
      padding: 0.8rem 1rem;
      color: var(--color-sumi);
    }

    .word-highlight {
      color: var(--color-aka);
      font-weight: bold;
      border-bottom: 2px solid var(--color-momo);
      padding-bottom: 2px;
    }

    /* ========================================
       フッター（下部）
       ======================================== */
    footer {
      background-color: var(--color-sumi);
      color: #dcd6cc;
      text-align: center;
      padding: 1.8rem 1rem;
      font-size: 0.85rem;
      margin-top: 3rem;
    }

    /* ========================================
       スマートフォン向けのレスポンシブ調整
       ======================================== */
    @media (max-width: 600px) {
      header {
        padding: 2.5rem 1rem 2.2rem;
      }

      h1 {
        font-size: 2rem;
      }

      .catchphrase {
        font-size: 1rem;
      }

      section {
        padding: 1.5rem 1.2rem;
      }

      /* スマホでは基本情報の項目と内容を縦並びに調整 */
      .basic-info-list {
        grid-template-columns: 1fr;
        row-gap: 0.3rem;
      }

      .basic-info-list dt {
        margin-top: 0.6rem;
      }

      .basic-info-list dt::after {
        content: "";
      }

      .basic-info-list dd {
        padding-left: 0;
        padding-bottom: 0.5rem;
        border-bottom: 1px dashed var(--border-line);
      }

      .basic-info-list dd:last-of-type {
        border-bottom: none;
      }
    }
  </style>
</head>
<body>

  <!-- ヘッダー：ニックネームとキャッチコピー -->
  <header>
    <p class="site-subtitle">自己紹介</p>
    <h1>き</h1>
    <p class="catchphrase">１日が３０時間あればいいのに.</p>
  </header>

  <!-- メインコンテンツ -->
  <main>

    <!-- 基本情報セクション -->
    <section class="sec-basic">
      <h2>基本情報</h2>
      <dl class="basic-info-list">
        <dt>ニックネーム</dt>
        <dd>き</dd>
        <dt>学年</dt>
        <dd>３</dd>
        <dt>所属</dt>
        <dd>拓殖大学工学部</dd>
      </dl>
    </section>

    <!-- 趣味・好きなことセクション -->
    <section class="sec-hobby">
      <h2>趣味・好きなこと</h2>
      <ul class="hobby-list">
        <li>ランニング</li>
        <li>サイクリング</li>
        <li>剣道</li>
        <li>ゲーム</li>
        <li>モード系ファッション</li>
        <li>山</li>
        <li>音楽</li>
      </ul>
    </section>

    <!-- プログラミング経験セクション -->
    <section class="sec-skill">
      <h2>プログラミング経験</h2>
      <ul class="skill-tags">
        <li>Java</li>
        <li>Python</li>
        <li>C</li>
        <li>JavaScript</li>
        <li>HTML</li>
        <li>CSS</li>
      </ul>
      <p class="skill-note">授業の演習で使った程度です.</p>
    </section>

    <!-- この授業で学びたいことセクション -->
    <section class="sec-goal">
      <h2>この授業で学びたいこと</h2>
      <p class="goal-text">OSSがなんたるか</p>
    </section>

    <!-- ひとことセクション -->
    <section class="sec-word">
      <h2>ひとこと</h2>
      <p class="word-quote">桃の花言葉は, 「<span class="word-highlight">天下無敵</span>」.</p>
    </section>

  </main>

  <!-- フッター -->
  <footer>
    <p>き - 拓殖大学工学部</p>
  </footer>

</body>
</html>
